name: netpad
description: SB Simple Netpad — LAN notepad with peer discovery and shared editing.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  code_text_field: ^1.1.0
  bonsoir: ^6.0.3
  web_socket_channel: ^3.0.3
  uuid: ^4.5.3
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  file_selector: ^1.1.0
  share_plus: ^13.1.0

# share_plus transitively pulls path_provider. path_provider_android >=2.3.0 moved to
# JNI (jni / jni_flutter), which breaks Linux desktop builds, so pin to the last
# pre-JNI release. We only share plain text, so path_provider is not exercised at runtime.
dependency_overrides:
  path_provider_android: 2.2.23

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/JetBrainsMono-Regular.ttf
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
