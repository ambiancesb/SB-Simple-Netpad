name: netpad
description: SB Simple Netpad — LAN notepad with peer discovery and shared editing.
publish_to: 'none'
version: 1.1.0+4

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  code_text_field: ^1.1.0
  linked_scroll_controller: ^0.2.0
  bonsoir: ^6.0.3
  web_socket_channel: ^3.0.3
  uuid: ^4.5.3
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  file_picker: ^8.3.7
  share_plus: ^10.1.4
  basic_utils: ^5.8.2
  crypto: ^3.0.7
  mdns_dart: ^2.2.1
  speech_to_text: ^7.4.0
  url_launcher: ^6.3.1
  purchases_flutter: ^9.2.0
  flutter_secure_storage: ^10.3.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  zxing2: ^0.2.4
  image: ^4.8.0

# path_provider is removed as a direct dep, but share_plus pulls it transitively.
# Newer platform implementations break the build via native dependencies:
#   - path_provider_android >=2.3.0 depends on `jni` (needs a JVM/jni.h), which
#     breaks some desktop host builds. 2.2.23 is the last pre-JNI release that still
#     compiles against the modern Android v2 embedding (older 2.2.x reference the
#     removed v1 `PluginRegistry.Registrar`).
#   - path_provider_foundation >=2.5.0 depends on `objective_c`, whose build hook
#     can fail on non-Apple hosts looking for a linker.
# We only share plain text, so path_provider is not exercised at runtime.
#
# speech_to_text_windows calls CoInitializeEx(APARTMENTTHREADED) in its plugin
# constructor, which conflicts with Flutter's COM init and can show a Windows
# "Debug Assertion Failed" dialog on Debug desktop launches. Voice dictation is
# mobile-only here, so we ship a no-op Windows stub instead.
dependency_overrides:
  path_provider_android: 2.2.23
  path_provider_foundation: 2.4.1
  speech_to_text_windows:
    path: packages/speech_to_text_windows_stub

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  ios: true
  macos:
    generate: true
  windows:
    generate: true
  # Solid brand blue behind the foreground layer (must match icon edges).
  adaptive_icon_background: '#2563EB'
  adaptive_icon_foreground: assets/icon/app_icon.png
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true

flutter_native_splash:
  color: '#EFF4FF'
  color_dark: '#0B1220'
  image: assets/icon/app_icon.png
  android_12:
    color: '#EFF4FF'
    color_dark: '#0B1220'
    image: assets/icon/app_icon.png
  ios: true
  android: true
  web: false

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
