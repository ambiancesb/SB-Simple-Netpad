name: netpad
description: SB Simple Netpad — LAN notepad with peer discovery and shared editing.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  code_text_field: ^1.1.0
  bonsoir: ^6.0.3
  web_socket_channel: ^3.0.3
  uuid: ^4.5.3
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5

# path_provider removed: path_provider_android pulls jni, which breaks Linux desktop builds.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/JetBrainsMono-Regular.ttf
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
