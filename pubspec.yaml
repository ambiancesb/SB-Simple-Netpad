name: netpad
description: SB Simple Netpad — LAN notepad with peer discovery and shared editing.
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  code_text_field: ^1.1.0
  linked_scroll_controller: ^0.2.0
  bonsoir: ^6.0.3
  web_socket_channel: ^3.0.3
  uuid: ^4.5.3
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  file_picker: ^8.3.7
  share_plus: ^10.1.4
  basic_utils: ^5.8.2
  crypto: ^3.0.7
  mdns_dart: ^2.2.1
  speech_to_text: ^7.4.0
  url_launcher: ^6.3.1

# path_provider is removed as a direct dep, but share_plus pulls it transitively.
# Newer platform implementations break the build via native dependencies:
#   - path_provider_android >=2.3.0 depends on `jni` (needs a JVM/jni.h), which
#     breaks Linux desktop builds. 2.2.23 is the last pre-JNI release that still
#     compiles against the modern Android v2 embedding (older 2.2.x reference the
#     removed v1 `PluginRegistry.Registrar`).
#   - path_provider_foundation >=2.5.0 depends on `objective_c`, whose build hook
#     runs on Linux too and fails looking for a linker.
# We only share plain text, so path_provider is not exercised at runtime.
dependency_overrides:
  path_provider_android: 2.2.23
  path_provider_foundation: 2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  ios: true
  macos:
    generate: true
  windows:
    generate: true
  linux:
    generate: true
  # Solid brand blue behind the foreground layer (must match icon edges).
  adaptive_icon_background: '#2563EB'
  adaptive_icon_foreground: assets/icon/app_icon.png
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/JetBrainsMono-Regular.ttf
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
